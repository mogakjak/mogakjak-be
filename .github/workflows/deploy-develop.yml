name: Deploy develop to Oracle

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-develop-oracle
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle development server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$HOME/.ssh/mogakjak_deploy"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mogakjak_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy develop
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/mogakjak_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            'cd /home/ubuntu/mogakjak-be &&
             if test -x scripts/deploy-dev.sh; then
               bash scripts/deploy-dev.sh;
             else
               test -z "$(git status --porcelain)" &&
               git fetch origin develop &&
               git checkout develop &&
               git merge --ff-only origin/develop &&
               bash scripts/deploy-dev.sh --skip-git-update;
             fi'
